<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FWMS">
  <meta name="theme-color" content="#1a73e8">
  <meta name="description" content="Factory Worker Management System - Attendance, Payroll, and Leave Management">
  <title>Factory Worker Management</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="app">
    <header class="app-header glass">
      <div class="header-content">
        <button class="icon-btn header-menu-btn" id="menuBtn" aria-label="Menu">
          <span class="material-symbols-rounded">factory</span>
        </button>
        <div class="header-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle" class="subtitle">Factory Worker Management</p>
        </div>
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
          <span class="material-symbols-rounded">refresh</span>
        </button>
      </div>
    </header>

    <main id="mainContent" class="main-content">
      <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
      <div id="offlineBanner" class="offline-banner hidden">
        <span class="material-symbols-rounded">cloud_off</span>
        <span>You're offline. Showing cached data.</span>
      </div>
      <div id="pageContainer"></div>
    </main>

    <nav class="bottom-nav glass" id="bottomNav" aria-label="Main navigation">
      <button class="nav-item active" data-page="dashboard">
        <span class="material-symbols-rounded">dashboard</span>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="workers">
        <span class="material-symbols-rounded">groups</span>
        <span>Workers</span>
      </button>
      <button class="nav-item" data-page="attendance">
        <span class="material-symbols-rounded">schedule</span>
        <span>Attendance</span>
      </button>
      <button class="nav-item" data-page="payroll">
        <span class="material-symbols-rounded">payments</span>
        <span>Payroll</span>
      </button>
      <button class="nav-item" data-page="more">
        <span class="material-symbols-rounded">more_horiz</span>
        <span>More</span>
      </button>
    </nav>

    <div id="moreSheet" class="bottom-sheet hidden">
      <div class="sheet-handle"></div>
      <div class="sheet-content">
        <button class="sheet-item" data-page="leaves">
          <span class="material-symbols-rounded">event_busy</span>
          <span>Leave Management</span>
        </button>
        <button class="sheet-item" data-page="reports">
          <span class="material-symbols-rounded">assessment</span>
          <span>Reports</span>
        </button>
        <button class="sheet-item" data-page="settings">
          <span class="material-symbols-rounded">settings</span>
          <span>Settings</span>
        </button>
      </div>
    </div>
    <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <div id="dialogContainer"></div>

  <div id="installPrompt" class="install-prompt hidden">
    <div class="install-content glass">
      <span class="material-symbols-rounded">install_mobile</span>
      <div>
        <strong>Install App</strong>
        <p>Add FWMS to your home screen for quick access</p>
      </div>
      <button id="installBtn" class="btn btn-primary btn-sm">Install</button>
      <button id="dismissInstall" class="icon-btn" aria-label="Dismiss">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
